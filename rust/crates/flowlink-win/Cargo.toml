[package]
name = "flowlink-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FlowLink for Windows: native input hooks, SendInput injection, tray UI"

[[bin]]
name = "flowlink-win"
path = "src/main.rs"

[dependencies]
flowlink-core = { path = "../flowlink-core" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
crossbeam-channel = "0.5"
# The egui UI is cross-platform on purpose: it also powers the offscreen
# preview/screenshot mode used to keep both shells visually identical.
eframe.workspace = true
egui.workspace = true
image.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
tray-icon.workspace = true
arboard.workspace = true
winreg.workspace = true
