[workspace]
resolver = "2"
members = [
    "crates/flowlink-core",
    "crates/flowlink-ffi",
    "crates/flowlink-win",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["FlowLink contributors"]
repository = "https://github.com/flowlink/flowlink"
description = "FlowLink — seamless keyboard/mouse/clipboard sharing between macOS and Windows"

[workspace.dependencies]
# Serialization & wire format
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Async runtime & networking
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

# TLS / crypto
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen = { version = "0.13", features = ["pem"] }
sha2 = "0.10"
subtle = "2"
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

# Discovery / QR
mdns-sd = "0.13"
qrcode = "0.14"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Utils
parking_lot = "0.12"
dirs = "5"
if-addrs = "0.13"
hostname = "0.4"
thiserror = "2"
anyhow = "1"

# --- Windows-only application stack (compiled only for windows targets) ---
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.31"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
winreg = "0.52"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1
